[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-fsm"
version = "0.1.0"
description = "Entity lifecycles declared once and advanced the same way by code, a model or an agent."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENCE.md"]
authors = [{ name = "OpenOutreach", email = "hello@openoutreach.app" }]
keywords = [
    "state-machine",
    "fsm",
    "workflow",
    "agents",
    "llm",
    "django",
    "open-source",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
]

dependencies = [
    "pydantic-ai-slim[anthropic]>=2.68",
]

[project.scripts]
agfsm = "agentic_fsm.cli:main"

[project.optional-dependencies]
django = [
    "Django>=6.1",
]
sqlalchemy = [
    "SQLAlchemy>=2.0.54",
]
dev = [
    "Django>=6.1",
    "SQLAlchemy>=2.0.54",
    "psycopg[binary]>=3.3.9",
    "pytest>=9.2",
    "pytest-django>=4.14",
]

[project.urls]
Source = "https://github.com/eracle/AgenticFSM"
Issues = "https://github.com/eracle/AgenticFSM/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentic_fsm"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
